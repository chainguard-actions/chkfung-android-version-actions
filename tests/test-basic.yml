name: Test basic usage - update versionCode and versionName
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare build.gradle fixture
        run: |
          mkdir -p /tmp/android-test
          cp "$GITHUB_WORKSPACE/tests/fixtures/build.gradle" /tmp/android-test/build.gradle

      - id: action
        uses: .
        with:
          gradlePath: /tmp/android-test/build.gradle
          versionCode: "42"
          versionName: "2.5.0"

      - name: Assert result output is Done
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "Done" ]; then
            echo "FAIL: expected 'Done' but got '$RESULT'"
            exit 1
          fi
          echo "PASS: result is 'Done'"

      - name: Assert versionCode was updated
        run: |
          CONTENT=$(cat /tmp/android-test/build.gradle)
          echo "build.gradle content:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -qE 'versionCode\s*42'; then
            echo "FAIL: versionCode 42 not found in build.gradle"
            exit 1
          fi
          echo "PASS: versionCode updated to 42"

      - name: Assert versionName was updated
        run: |
          CONTENT=$(cat /tmp/android-test/build.gradle)
          if ! echo "$CONTENT" | grep -qE 'versionName\s*"2\.5\.0"'; then
            echo "FAIL: versionName 2.5.0 not found in build.gradle"
            exit 1
          fi
          echo "PASS: versionName updated to 2.5.0"
