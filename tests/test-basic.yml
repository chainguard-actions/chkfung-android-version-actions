name: Test basic usage - update versionCode and versionName
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare build.gradle fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app"
          cp "$GITHUB_WORKSPACE/tests/fixtures/app/build.gradle" "$GITHUB_WORKSPACE/app/build.gradle"

      - id: action
        uses: .
        with:
          gradlePath: app/build.gradle
          versionCode: "42"
          versionName: "2.0.0"

      - name: Assert result output
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "Done" ]; then
            echo "FAIL: expected output 'Done', got '$RESULT'"
            exit 1
          fi
          echo "PASS: result output is 'Done'"

      - name: Assert versionCode was updated
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/app/build.gradle")
          echo "build.gradle content:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -qE 'versionCode\s*42'; then
            echo "FAIL: versionCode was not updated to 42"
            exit 1
          fi
          echo "PASS: versionCode updated to 42"

      - name: Assert versionName was updated
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/app/build.gradle")
          if ! echo "$CONTENT" | grep -qE 'versionName\s*"2\.0\.0"'; then
            echo "FAIL: versionName was not updated to 2.0.0"
            exit 1
          fi
          echo "PASS: versionName updated to 2.0.0"
