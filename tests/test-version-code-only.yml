name: Test version code only update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake build.gradle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/app-code-only"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/app-code-only/build.gradle" <<'EOF'
          android {
              defaultConfig {
                  versionCode 5
                  versionName "1.0.0"
              }
          }
          EOF

      - id: action
        uses: .
        with:
          gradlePath: tests/fixtures/app-code-only/build.gradle
          versionCode: "99"

      - name: Assert result output is Done
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "Done" ]; then
            echo "FAIL: expected 'Done' but got '$RESULT'"
            exit 1
          fi
          echo "PASS: result is Done"

      - name: Assert versionCode was updated
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tests/fixtures/app-code-only/build.gradle")
          echo "gradle content:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -qE 'versionCode[[:space:]=]*99'; then
            echo "FAIL: versionCode was not updated to 99"
            exit 1
          fi
          echo "PASS: versionCode updated to 99"

      - name: Assert versionName was NOT changed
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tests/fixtures/app-code-only/build.gradle")
          if ! echo "$CONTENT" | grep -qE 'versionName[[:space:]=]*"1\.0\.0"'; then
            echo "FAIL: versionName should remain '1.0.0'"
            exit 1
          fi
          echo "PASS: versionName unchanged"
