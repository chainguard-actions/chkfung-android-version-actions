name: Test update versionCode only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare build.gradle fixture
        run: |
          mkdir -p /tmp/android-test-code
          cp "$GITHUB_WORKSPACE/tests/fixtures/build.gradle" /tmp/android-test-code/build.gradle

      - id: action
        uses: .
        with:
          gradlePath: /tmp/android-test-code/build.gradle
          versionCode: "100"

      - name: Assert result output is Done
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "Done" ]; then
            echo "FAIL: expected 'Done' but got '$RESULT'"
            exit 1
          fi
          echo "PASS: result is 'Done'"

      - name: Assert versionCode was updated
        run: |
          CONTENT=$(cat /tmp/android-test-code/build.gradle)
          echo "build.gradle content:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -qE 'versionCode\s*100'; then
            echo "FAIL: versionCode 100 not found in build.gradle"
            exit 1
          fi
          echo "PASS: versionCode updated to 100"

      - name: Assert versionName was NOT changed
        run: |
          CONTENT=$(cat /tmp/android-test-code/build.gradle)
          if ! echo "$CONTENT" | grep -qE 'versionName\s*"1\.0\.0"'; then
            echo "FAIL: versionName should still be 1.0.0 but was changed"
            exit 1
          fi
          echo "PASS: versionName unchanged at 1.0.0"
