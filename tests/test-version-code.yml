name: Test versionCode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare gradle file
        run: |
          mkdir -p app
          cp $GITHUB_WORKSPACE/actions/hardened/chkfung--android-version-actions/v1.2.1/tests/fixtures/app/build.gradle app/build.gradle

      - id: action
        uses: .
        with:
          gradlePath: app/build.gradle
          versionCode: "42"

      - name: Assert result output
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "Done" ]; then
            echo "FAIL: expected 'Done' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: result output is 'Done'"

      - name: Assert versionCode was updated
        run: |
          echo "--- build.gradle contents ---"
          cat app/build.gradle
          if ! grep -q "versionCode 42" app/build.gradle; then
            echo "FAIL: versionCode was not updated to 42"
            exit 1
          fi
          echo "PASS: versionCode updated to 42"
