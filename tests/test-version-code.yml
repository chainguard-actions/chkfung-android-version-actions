name: Test versionCode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare build.gradle for test
        run: |
          mkdir -p /tmp/android-test/app
          cp $GITHUB_WORKSPACE/actions/hardened/chkfung--android-version-actions/v1.2.3/tests/fixtures/app/build.gradle /tmp/android-test/app/build.gradle
          echo "Initial build.gradle:"
          cat /tmp/android-test/app/build.gradle

      - id: action
        uses: .
        with:
          gradlePath: /tmp/android-test/app/build.gradle
          versionCode: "42"

      - name: Assert result output is set
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: expected result output to be non-empty"
            exit 1
          fi
          echo "PASS: result output is set"

      - name: Assert versionCode was updated
        run: |
          echo "Updated build.gradle:"
          cat /tmp/android-test/app/build.gradle
          if ! grep -q "versionCode 42" /tmp/android-test/app/build.gradle; then
            echo "FAIL: expected versionCode 42 in build.gradle"
            exit 1
          fi
          echo "PASS: versionCode updated to 42"
