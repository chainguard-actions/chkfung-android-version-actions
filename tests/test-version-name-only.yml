name: Test version name only update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake build.gradle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/app-name-only"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/app-name-only/build.gradle" <<'EOF'
          android {
              defaultConfig {
                  versionCode 10
                  versionName "1.0.0"
              }
          }
          EOF

      - id: action
        uses: .
        with:
          gradlePath: tests/fixtures/app-name-only/build.gradle
          versionName: "3.5.1"

      - name: Assert result output is Done
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "Done" ]; then
            echo "FAIL: expected 'Done' but got '$RESULT'"
            exit 1
          fi
          echo "PASS: result is Done"

      - name: Assert versionName was updated
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tests/fixtures/app-name-only/build.gradle")
          echo "gradle content:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -qE 'versionName[[:space:]=]*"3\.5\.1"'; then
            echo "FAIL: versionName was not updated to 3.5.1"
            exit 1
          fi
          echo "PASS: versionName updated to 3.5.1"

      - name: Assert versionCode was NOT changed
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tests/fixtures/app-name-only/build.gradle")
          if ! echo "$CONTENT" | grep -qE 'versionCode[[:space:]=]*10'; then
            echo "FAIL: versionCode should remain 10"
            exit 1
          fi
          echo "PASS: versionCode unchanged"
