name: Test update versionName only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample build.gradle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app"
          cat > "$GITHUB_WORKSPACE/app/build.gradle" <<'EOF'
          android {
              defaultConfig {
                  versionCode 7
                  versionName "0.9.0"
              }
          }
          EOF

      - id: action
        uses: .
        with:
          gradlePath: app/build.gradle
          versionName: "3.1.4"

      - name: Assert result output is Done
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "Done" ]; then
            echo "FAIL: expected 'Done' but got '$RESULT'"
            exit 1
          fi
          echo "PASS: result is 'Done'"

      - name: Assert versionName was updated
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/app/build.gradle")
          echo "gradle content:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -qE 'versionName\s*"3\.1\.4"'; then
            echo "FAIL: versionName was not updated to 3.1.4"
            exit 1
          fi
          echo "PASS: versionName updated correctly"

      - name: Assert versionCode was NOT changed
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/app/build.gradle")
          if ! echo "$CONTENT" | grep -qE 'versionCode\s*7'; then
            echo "FAIL: versionCode should remain 7 but was changed"
            exit 1
          fi
          echo "PASS: versionCode unchanged"
