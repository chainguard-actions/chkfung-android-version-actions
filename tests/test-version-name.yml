name: Test versionName input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture build.gradle to workspace
        run: |
          mkdir -p app
          cp actions/hardened/chkfung--android-version-actions/v1.1/tests/fixtures/build.gradle app/build.gradle

      - id: action
        uses: .
        with:
          gradlePath: app/build.gradle
          versionName: "2.5.0"

      - name: Assert result output is Done
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "Done" ]; then
            echo "FAIL: expected 'Done' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert versionName was updated in build.gradle
        run: |
          echo "Contents of app/build.gradle:"
          cat app/build.gradle
          if ! grep -q 'versionName "2.5.0"' app/build.gradle; then
            echo "FAIL: expected versionName \"2.5.0\" in build.gradle"
            exit 1
          fi
          echo "PASS: versionName updated to 2.5.0"
