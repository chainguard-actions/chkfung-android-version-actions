name: Test versionName input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare build.gradle for test
        run: |
          mkdir -p /tmp/android-test-name/app
          cp $GITHUB_WORKSPACE/actions/hardened/chkfung--android-version-actions/v1.2.3/tests/fixtures/app/build.gradle /tmp/android-test-name/app/build.gradle
          echo "Initial build.gradle:"
          cat /tmp/android-test-name/app/build.gradle

      - id: action
        uses: .
        with:
          gradlePath: /tmp/android-test-name/app/build.gradle
          versionName: "2.5.1"

      - name: Assert result output is set
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ -z "$RESULT" ]; then
            echo "FAIL: expected result output to be non-empty"
            exit 1
          fi
          echo "PASS: result output is set"

      - name: Assert versionName was updated
        run: |
          echo "Updated build.gradle:"
          cat /tmp/android-test-name/app/build.gradle
          if ! grep -q 'versionName "2.5.1"' /tmp/android-test-name/app/build.gradle; then
            echo "FAIL: expected versionName \"2.5.1\" in build.gradle"
            exit 1
          fi
          echo "PASS: versionName updated to 2.5.1"
